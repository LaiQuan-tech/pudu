<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>CellFlow</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&family=Noto+Serif+TC:wght@700;900&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
  :root{
    --bg:#f3f4f6; --surface:#fff; --ink:#16191d; --ink2:#4b5563; --muted:#8b94a0;
    --line:#e2e5ea; --accent:#2f5fd0; --accent-bg:#eaf0fd;
    --ok:#1c7a4a; --ok-bg:#e6f4ec; --warn:#9a6b00; --warn-bg:#fbf1d9;
    --paper:#f6f2e6; --card:#fffdf6; --sunk:#efe9d8; --pink:#231e18; --pmuted:#8a7d6b;
    --prule:#e2d9c3; --cinnabar:#b3261e; --gold:#8a6a2b; --gold-bg:#f1e7cd;
  }
  @media (prefers-color-scheme:dark){:root{
    --bg:#0f1114; --surface:#171a1f; --ink:#e8ebef; --ink2:#aeb6c0; --muted:#79828e;
    --line:#272c33; --accent:#7ba0f5; --accent-bg:#1a2438;
    --ok:#5cc48b; --ok-bg:#14291e; --warn:#d4a63c; --warn-bg:#2b2312;
    --paper:#13110e; --card:#1d1a15; --sunk:#171410; --pink:#f0e9db; --pmuted:#948877;
    --prule:#332d24; --cinnabar:#e4756a; --gold:#cba55f; --gold-bg:#2c2415;
  }}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);
    font:14px/1.6 "Noto Sans TC",-apple-system,BlinkMacSystemFont,"PingFang TC",sans-serif}
  .wrap{max-width:560px;margin:0 auto;padding:20px 16px 60px}
  code,.mono{font-family:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,monospace}

  header h1{font-family:"Noto Serif TC",serif;font-size:30px;font-weight:900;margin:0;letter-spacing:.01em}
  header p{margin:8px 0 0;color:var(--ink2);font-size:14.5px;line-height:1.65}

  .panel{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:16px;margin-top:18px}
  .row{display:flex;gap:8px;flex-wrap:wrap}
  input[type=url],input[type=text]{flex:1 1 320px;min-width:0;font:inherit;font-size:13.5px;
    padding:9px 11px;border:1px solid var(--line);border-radius:7px;background:var(--bg);color:var(--ink)}
  input:focus,select:focus,button:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
  button{font:inherit;font-size:13.5px;font-weight:600;padding:9px 16px;border-radius:7px;
    border:1px solid var(--accent);background:var(--accent);color:#fff;cursor:pointer}
  button.ghost{background:transparent;color:var(--accent)}
  button:disabled{opacity:.5;cursor:default}
  select{font:inherit;font-size:13px;padding:6px 9px;border:1px solid var(--line);
    border-radius:6px;background:var(--surface);color:var(--ink)}
  .samples{margin-top:10px;font-size:12.5px;color:var(--muted);display:flex;gap:6px;flex-wrap:wrap;align-items:center}
  .samples button{background:none;border:1px dashed var(--line);color:var(--ink2);
    font-weight:500;padding:4px 10px;font-size:12.5px}
  .drop{margin-top:10px;border:1.5px dashed var(--line);border-radius:8px;padding:14px;
    text-align:center;color:var(--muted);font-size:12.5px}
  .drop.over{border-color:var(--accent);background:var(--accent-bg);color:var(--accent)}
  .hint2{margin-top:9px;font-size:12px;color:var(--muted);line-height:1.6}
  .hint2 b{color:var(--ink2);font-weight:600}
  .diag{margin-top:10px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
  .diag button{font-size:12.5px;padding:7px 13px;background:transparent;color:var(--accent);border:1px solid var(--accent)}
  .diag button:hover{background:var(--accent);color:#fff}
  .diag span{font-size:12px;color:var(--muted)}
  .msg{margin-top:10px;padding:10px 12px;border-radius:7px;font-size:13px;display:none}
  .msg.show{display:block}
  .msg.err{background:var(--warn-bg);color:var(--warn)}

  .split{margin-top:16px}
  /* 技術檢視預設收起來——那是給開發看的，不是給使用者的 */
  .why{margin-top:18px}
  .why summary{cursor:pointer;font-size:12.5px;color:var(--muted);padding:8px 0;list-style:none}
  .why summary::-webkit-details-marker{display:none}
  .why summary::before{content:"▸ ";font-size:11px}
  .why[open] summary::before{content:"▾ "}
  .why summary:hover{color:var(--accent)}

  .tabs{display:flex;gap:6px;flex-wrap:wrap;margin-top:14px}
  .tabs button{font-size:12.5px;font-weight:600;padding:6px 12px;border-radius:6px;
    border:1px solid var(--line);background:var(--surface);color:var(--ink2)}
  .tabs button.on{background:var(--accent);border-color:var(--accent);color:#fff}
  .struct{font-size:12px;color:var(--muted);margin:0 0 10px;display:flex;gap:5px 12px;flex-wrap:wrap}
  .struct b{color:var(--ink2);font-weight:600}
  .struct .fix{color:var(--ok);background:var(--ok-bg);padding:1px 7px;border-radius:4px;font-weight:600}
  .out .totals{margin:10px 0 4px;padding:10px 12px;background:var(--gold-bg);border-radius:5px;
    display:flex;flex-wrap:wrap;gap:4px 14px;font-size:13px}
  .out .totals .tk{color:var(--gold);font-weight:600}
  .out .totals .tv{font-weight:700;font-variant-numeric:tabular-nums}
  .out .doc-title{font-family:"Noto Serif TC",serif;font-size:17px;font-weight:900;
    margin:0 0 2px;line-height:1.35}
  .ask{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-top:14px;
    padding:12px 14px;border:1px solid var(--accent);background:var(--accent-bg);border-radius:9px}
  .ask[hidden]{display:none}
  .ask .q{font-size:13.5px;color:var(--ink)}
  .ask .q b{font-weight:700}
  .ask button{font-size:13px;font-weight:600;padding:6px 13px;border-radius:6px;
    border:1px solid var(--accent);background:var(--surface);color:var(--accent);cursor:pointer}
  .ask button:hover{background:var(--accent);color:#fff}
  .ask .x{margin-left:auto;border:0;background:none;color:var(--muted);font-size:17px;padding:2px 6px}
  .ask .x:hover{background:none;color:var(--ink)}
  .verdict{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:4px}
  .verdict .shape{font-family:"Noto Serif TC",serif;font-size:19px;font-weight:900}
  .badge{font-size:11px;font-weight:700;padding:3px 9px;border-radius:99px;background:var(--ok-bg);color:var(--ok)}
  .why{color:var(--ink2);font-size:13px;margin:2px 0 14px}

  .twrap{overflow-x:auto;-webkit-overflow-scrolling:touch}
  table{width:100%;border-collapse:collapse;font-size:12.5px}
  th{text-align:left;font-size:10.5px;letter-spacing:.1em;color:var(--muted);
     font-weight:700;padding:0 8px 7px 0;border-bottom:1px solid var(--line)}
  td{padding:8px 8px 8px 0;border-bottom:1px solid var(--line);vertical-align:top}
  tr:last-child td{border-bottom:0}
  .cname{font-weight:600}
  .ttag{font-family:"JetBrains Mono",monospace;font-size:11px;font-weight:600;
    padding:2px 6px;border-radius:4px;background:var(--accent-bg);color:var(--accent);white-space:nowrap}
  .ttag.dim{background:var(--bg);color:var(--muted)}
  .rtag{font-size:10.5px;font-weight:700;color:var(--ok);background:var(--ok-bg);
    padding:2px 6px;border-radius:4px;white-space:nowrap}
  .rtag.none{background:transparent;color:var(--muted)}
  .conf{font-family:"JetBrains Mono",monospace;font-size:11.5px;color:var(--ink2);text-align:right}
  .why-cell{color:var(--muted);font-size:11.5px}
  .samp{color:var(--muted);font-size:11px;margin-top:3px;
    overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:210px}

  .overrides{display:flex;gap:14px;flex-wrap:wrap;margin-top:14px;padding-top:14px;border-top:1px solid var(--line)}
  .overrides label{font-size:12px;color:var(--muted);display:flex;flex-direction:column;gap:4px}

  /* ── 手機預覽 ── */
  .phonewrap{}
  .phonelabel{display:none}
  .phone{border:1px solid var(--prule);border-radius:12px;overflow:hidden;background:var(--paper);
    max-width:100%}

  .octl{position:sticky;top:0;z-index:5;background:var(--paper);padding:10px 14px 9px;
    border-bottom:1px solid var(--prule);display:flex;gap:7px;flex-wrap:wrap}
  .octl[hidden]{display:none}
  .octl input,.octl select{font-family:inherit;font-size:13px;color:var(--pink);
    background:var(--card);border:1px solid var(--prule);border-radius:4px;padding:7px 9px;
    min-width:0;-webkit-appearance:none;appearance:none}
  .octl input{flex:1 1 100%}
  .octl select{flex:1 1 44%}
  .octl input:focus,.octl select:focus{outline:2px solid var(--cinnabar);outline-offset:-1px}
  .hits{width:100%;font-size:11.5px;color:var(--pmuted)}
  .orail{display:flex;gap:6px;overflow-x:auto;width:100%;margin:2px -14px 0;padding:0 14px 3px;
    scrollbar-width:none;-webkit-overflow-scrolling:touch}
  .orail::-webkit-scrollbar{display:none}
  .orail button{flex:0 0 auto;font:inherit;font-size:12px;line-height:1;white-space:nowrap;
    padding:7px 10px;border-radius:99px;border:1px solid var(--prule);background:var(--card);
    color:var(--pmuted);cursor:pointer;font-variant-numeric:tabular-nums}
  .orail button.on{background:var(--pink);border-color:var(--pink);color:var(--paper);font-weight:700}
  .orail button.now{border-color:var(--cinnabar);color:var(--cinnabar);font-weight:700}
  .orail button.now.on{color:var(--paper)}
  .orail.tables button.on{background:var(--gold);border-color:var(--gold)}
  .out{padding:16px 14px 40px;color:var(--pink);font-size:15px;line-height:1.65}
  .out .quote{margin:0 0 10px;padding:11px 12px;background:var(--card);
    border:1px solid var(--prule);border-radius:5px}
  .out .quote h4{margin:0 0 7px;font-size:10.5px;letter-spacing:.14em;color:var(--pmuted);font-weight:700}
  .out .quote dl{margin:0;display:grid;grid-template-columns:auto 1fr;gap:5px 12px;align-items:baseline}
  .out .quote dt{font-family:"Noto Serif TC",serif;font-size:15px;font-weight:700;
    font-variant-numeric:tabular-nums;white-space:nowrap;color:var(--pink)}
  .out .quote dd{margin:0;font-size:12px;color:var(--pmuted);line-height:1.45}
  .out .quote .src{font-size:10px;opacity:.6;margin-left:4px}
  .out .upnext{display:grid;grid-template-columns:repeat(auto-fit,minmax(84px,1fr));gap:1px;
    background:var(--prule);border:1px solid var(--prule);border-radius:4px;overflow:hidden;margin:0 0 4px}
  .out .upnext button{all:unset;background:var(--card);padding:9px 10px 10px;cursor:pointer;
    display:flex;flex-direction:column;gap:2px}
  .out .upnext button:hover{background:var(--gold-bg)}
  .out .upnext button.on{background:var(--pink)}
  .out .upnext button.on .k,.out .upnext button.on .n{color:var(--paper);opacity:.75}
  .out .upnext button.on .d{color:var(--paper)}
  .out .upnext .k{font-size:10px;letter-spacing:.14em;color:var(--pmuted);font-weight:700}
  .out .upnext .d{font-family:"Noto Serif TC",serif;font-size:17px;font-weight:700;
    font-variant-numeric:tabular-nums;color:var(--pink)}
  .out .upnext .n{font-size:11.5px;color:var(--pmuted);font-variant-numeric:tabular-nums}
  .out .upnext button.hot .d{color:var(--cinnabar)}
  .out .g-head{position:sticky;top:0;background:var(--paper);z-index:2;display:flex;
    align-items:baseline;gap:8px;padding:14px 0 6px;border-bottom:1px solid var(--pink)}
  .out .g-head:first-child{padding-top:2px}
  .out .g-name{font-family:"Noto Serif TC",serif;font-size:20px;font-weight:700}
  .out .g-sub{font-size:12px;color:var(--pmuted)}
  .out .g-cnt{margin-left:auto;font-size:11px;color:var(--pmuted)}
  .out ol{list-style:none;margin:0;padding:0}
  .out .rec{display:grid;grid-template-columns:48px 1fr;gap:0 18px;padding:10px 0;border-bottom:1px solid var(--prule)}
  .out .rec.nolead{grid-template-columns:1fr}
  .out .rec:last-child{border-bottom:0}
  .out .lead{text-align:right;font-size:13px;font-weight:700;color:var(--cinnabar);
    font-variant-numeric:tabular-nums;padding-top:2px}
  .out .titleline{display:flex;gap:10px;align-items:baseline}
  .out .t{margin:0;font-size:15.5px;font-weight:600;white-space:pre-wrap;flex:1}
  .out .price{font-weight:700;color:var(--cinnabar);font-variant-numeric:tabular-nums;white-space:nowrap}
  .out .metas{display:flex;flex-wrap:wrap;gap:5px;margin-top:6px}
  .out .m{font-size:11.5px;padding:2px 8px;border-radius:99px;background:var(--gold-bg);color:var(--gold)}
  .out a.m{text-decoration:none}
  .out .body{margin-top:8px;padding:9px 11px;background:var(--sunk);border-radius:4px;
    font-size:13.5px;color:var(--pmuted);white-space:pre-wrap;line-height:1.7}
  .out .kv{margin-top:7px;display:grid;grid-template-columns:auto 1fr;gap:2px 12px;font-size:12.5px}
  .out .k{color:var(--pmuted)}
  .out .v{white-space:pre-wrap}
  .out .none{padding:70px 20px;text-align:center;color:var(--pmuted)}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>CellFlow</h1>
    <p>把複雜 Excel，一鍵變成最適合手機閱讀的流暢網頁。</p>
  </header>

  <div class="panel">
    <div class="row">
      <input id="url" type="url" placeholder="貼上 Google 試算表網址">
      <button id="go">開啟</button>
    </div>
    <div class="drop" id="drop">或點這裡選擇 .xlsx / .csv 檔案</div>
    <p class="hint2">
      <b>資料不會上傳。</b>整個過程都在你的手機裡完成，這頁沒有後端伺服器。<br>
      Google 試算表請先在「共用」把權限改成<b>「知道連結的任何人」</b>，否則讀不到。
    </p>
    <div class="samples">
      <span>試試看：</span>
      <button data-s="pudu">活動流程表</button>
      <button data-s="budget">個人預算表</button>
      <button data-s="pnl">損益表</button>
      <button data-s="invoice">發票</button>
      <button data-s="daily">每日排程</button>
      <button data-s="todo">購物清單</button>
    </div>
    <div class="msg" id="msg"></div>
  </div>

  <div class="tabs" id="tabs" hidden></div>
  <div class="ask" id="ask" hidden></div>

  <div class="split" id="split" hidden>
    <section class="phonewrap">
      <p class="phonelabel">使用者看到的畫面</p>
      <div class="phone"><div class="octl" id="octl" hidden></div><div class="out" id="out"></div></div>
    </section>

    <details class="why">
      <summary>為什麼這樣顯示？</summary>
    <div class="diag" id="diag" hidden>
      <button type="button" id="copyDiag">複製診斷資訊</button>
      <span>顯示不對的話，按這個再貼給我們。<b>只含欄位結構，不含任何內容。</b></span>
    </div>
    <section class="panel">
      <div class="verdict">
        <span class="shape" id="shape"></span>
        <span class="badge" id="dims"></span>
      </div>
      <p class="why" id="why"></p>
      <p class="struct" id="struct"></p>
      <div class="twrap"><table>
        <thead><tr><th>欄位</th><th>判定型別</th><th>角色</th><th class="conf">信心</th><th>依據</th></tr></thead>
        <tbody id="cols"></tbody>
      </table></div>
      <div class="overrides">
        <label>版面
          <select id="ovShape">
            <option value="">自動</option>
            <option value="schedule">排程／時程表</option>
            <option value="pricelist">品項／價目表</option>
            <option value="directory">名冊／通訊錄</option>
            <option value="board">狀態清單</option>
            <option value="ledger">帳務／明細表</option>
            <option value="matrix">矩陣／報表</option>
            <option value="cards">一般表格</option>
          </select>
        </label>
        <label>分組依據 <select id="ovGroup"></select></label>
        <label>主標題欄 <select id="ovTitle"></select></label>
      </div>
    </section>
    </details>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<!-- 改引擎時要把 v 往上加，否則瀏覽器會繼續跑快取裡的舊版 -->
<script src="detect.js?v=25"></script>
<script>
var MS = 'https://createcatalog.public.onecdn.static.microsoft/catalog-assets/en-us/';
// 全部是真實檔案。自編的乾淨範例會給人虛假的信心——
// 今天一整天的判斷錯誤，沒有一個是自編範例抓到的。
var SAMPLES = {
  pudu:    { url:'https://docs.google.com/spreadsheets/d/1b72qwLM_0xUdisA2uKxqUa98-EJwC-UJPyXsEaLJoiI/edit' },
  budget:  { xlsx: MS+'011bc58a-7255-44cf-aa2a-c6a0850d08ec/TF011bc58a-7255-44cf-aa2a-c6a0850d08ecccb50fde_wac-8f4b0de17cd8.xlsx', name:'個人預算表.xlsx' },
  pnl:     { xlsx: MS+'b3a410cc-f521-44c8-a72e-ab39815d9b4e/TFb3a410cc-f521-44c8-a72e-ab39815d9b4e0822a846_wac-0dd27a714bda.xlsx', name:'損益表.xlsx' },
  invoice: { xlsx: MS+'cc8f8a79-96c3-4a3f-9398-5fdcfa9b27e9/TFcc8f8a79-96c3-4a3f-9398-5fdcfa9b27e93382434e_wac-6d730e0d4479.xlsx', name:'發票.xlsx' },
  daily:   { xlsx: MS+'792c56ff-5931-4f2e-bbd3-a00d737f9b57/TF792c56ff-5931-4f2e-bbd3-a00d737f9b57f490ba94_wac-084bd93fcd07.xlsx', name:'每日排程.xlsx' },
  todo:    { xlsx: MS+'e6ae6c3f-7542-4b5a-80ce-d131a04ae548/TFe6ae6c3f-7542-4b5a-80ce-d131a04ae54880b3e4b5_wac-034cc1abfa54.xlsx', name:'購物清單.xlsx' }
};

var $ = function(id){ return document.getElementById(id) };
var A = null, raw = null, TABLES = [], cur = 0, sheetKey = 'local';
var outQ = '', outPicks = {}, filterCols = [], outGroup = '';

/* 使用者對「怎麼分段」的選擇要記住，同一份表不該問第二次。 */
function choiceKey(){ return 'shape-choice:' + sheetKey + ':' + cur }
function readChoice(){ try { return localStorage.getItem(choiceKey()) } catch(e){ return null } }
function saveChoice(v){ try { localStorage.setItem(choiceKey(), v) } catch(e){} }

function say(t, isErr){
  var m = $('msg');
  m.className = 'msg show' + (isErr ? ' err' : '');
  m.textContent = t;
  if(!t) m.className = 'msg';
}

function parseCSV(t){
  var R = [], row = [], f = '', q = false;
  for(var i = 0; i < t.length; i++){
    var c = t[i];
    if(q){ if(c === '"'){ if(t[i+1] === '"'){ f += '"'; i++; } else q = false; } else f += c; }
    else if(c === '"') q = true;
    else if(c === ','){ row.push(f); f = ''; }
    else if(c === '\n'){ row.push(f); R.push(row); row = []; f = ''; }
    else if(c !== '\r') f += c;
  }
  if(f !== '' || row.length){ row.push(f); R.push(row); }
  return R;
}

function sheetId(u){
  var m = String(u).match(/\/spreadsheets\/d\/([a-zA-Z0-9-_]+)/);
  return m ? m[1] : null;
}

function loadUrl(u){
  var id = sheetId(u);
  if(!id) return say('看不出這是 Google 試算表的網址，請貼包含 /spreadsheets/d/ 的完整網址。', true);
  sheetKey = id;
  var gid = (String(u).match(/[#&?]gid=(\d+)/) || [])[1];
  var csv = 'https://docs.google.com/spreadsheets/d/' + id + '/export?format=csv' +
            (gid ? '&gid=' + gid : '') + '&_=' + Date.now();
  say('載入中…');
  fetch(csv, { cache:'no-store' })
    .then(function(r){ if(!r.ok) throw new Error('HTTP ' + r.status); return r.text() })
    .then(function(t){ say(''); run(parseCSV(t)) })
    .catch(function(e){
      say('讀不到這份試算表（' + e.message + '）。請確認共用設定是「知道連結的任何人 · 檢視者」。', true);
    });
}

function loadFile(file){
  var ext = (file.name.split('.').pop() || '').toLowerCase();
  var fr = new FileReader();
  if(ext === 'xlsx' || ext === 'xls'){
    if(typeof XLSX === 'undefined')
      return say('Excel 解析元件沒載入成功，請改用 .csv 或試算表網址。', true);
    fr.onload = function(e){
      try{
        openWorkbook(XLSX.read(new Uint8Array(e.target.result), { type:'array' }), file.name);
      }catch(err){ say('這個 Excel 檔解析失敗：' + err.message, true) }
    };
    fr.readAsArrayBuffer(file);
  } else {
    fr.onload = function(e){ say(''); run(parseCSV(e.target.result)) };
    fr.readAsText(file, 'utf-8');
  }
}

/* 挑第一張真的有資料的工作表。範本的第一張常常是 Start／說明頁。 */
function openWorkbook(wb, fname){
  var pick = null, skipped = [];
  for(var i = 0; i < wb.SheetNames.length; i++){
    var nm = wb.SheetNames[i];
    var gr = XLSX.utils.sheet_to_json(wb.Sheets[nm], { header:1, defval:'', raw:false });
    var v = SheetShape.sheetVerdict(gr, SheetShape.analyseSheet(gr).tables);
    if(v.show === true){ pick = { name:nm, grid:gr }; break; }
    skipped.push(nm + '（' + v.why + '）');
  }
  if(!pick){ say('這個檔案裡找不到可讀的資料表。略過：' + skipped.join('、'), true); return; }
  say(skipped.length ? '顯示工作表「' + pick.name + '」，略過 ' + skipped.length + ' 張非資料頁：' + skipped.join('、') : '');
  sheetKey = 'file:' + fname + ':' + pick.name;
  run(pick.grid);
}

function loadXlsxUrl(url, name){
  say('下載中…');
  fetch(url).then(function(r){ if(!r.ok) throw new Error('HTTP ' + r.status); return r.arrayBuffer() })
    .then(function(buf){
      if(typeof XLSX === 'undefined') throw new Error('Excel 解析元件沒載入成功');
      openWorkbook(XLSX.read(new Uint8Array(buf), { type:'array' }), name);
    })
    .catch(function(e){ say('讀不到這個範本：' + e.message, true) });
}

/* ══ 分析並畫出來 ══ */
function run(rows){
  raw = rows;
  TABLES = SheetShape.analyseSheet(rows).tables;
  if(!TABLES.length) return say('這份表看起來是空的，或找不到任何表格區塊。', true);
  cur = 0;
  var t = $('tabs');
  t.hidden = TABLES.length < 2;
  t.innerHTML = TABLES.length < 2 ? '' : TABLES.map(function(a, i){
    var nm = a.name || (a.title ? a.title.split('·')[0].trim() : '');
    return '<button type="button" data-i="' + i + '" class="' + (i ? '' : 'on') + '">' +
           esc(nm || ('表 ' + (i + 1))) + '</button>';
  }).join('');
  if(TABLES.length > 1) say('這張工作表上並排著 ' + TABLES.length + ' 個獨立表格，已自動切開。');
  $('split').hidden = false;
  $('diag').hidden = false;
  showTable(0);
}

function showTable(i){
  cur = i; A = TABLES[i];
  outQ = ''; outPicks = {}; outGroup = '';
  [].forEach.call($('tabs').children, function(b, j){ b.classList.toggle('on', i === j) });
  fillOverrides();
  var saved = readChoice();
  if(saved && saved !== '__dismissed__') $('ovGroup').value = saved;
  paint();
  askGrouping(saved);
}

/* 只在引擎真的舉棋不定、而且使用者還沒表態過時才問一次。 */
function askGrouping(saved){
  var bar = $('ask');
  bar.hidden = true;
  if(saved) return;                                  // 問過了
  var opts = SheetShape.shouldAsk(A);
  if(!opts.length) return;                           // 沒有第二種說得通的讀法

  var curName = A.roles.group ? A.roles.group.name : null;
  var choices = opts.filter(function(o){ return o.name !== curName })
    .map(function(o){
      return '<button type="button" data-k="' + esc(o.name) + '">' +
             esc(o.name) + '（' + o.groups + ' 組）</button>';
    });
  if(curName) choices.push('<button type="button" data-k="__none__">不分段</button>');
  if(!choices.length) return;

  bar.innerHTML =
    '<span class="q">目前' +
      (curName ? '按<b>「' + esc(curName) + '」</b>分段' : '<b>不分段</b>') +
    '。要改成？</span>' + choices.join('') +
    '<button type="button" class="x" data-k="__dismissed__" title="維持現狀">×</button>';
  bar.hidden = false;
}

function fillOverrides(){
  var live = A.cols.filter(function(c){ return c.type !== 'empty' });
  var g = $('ovGroup'), t = $('ovTitle');
  var autoG = A.roles.group ? A.roles.group.name : '不分組';
  var autoT = A.roles.title ? A.roles.title.name : '無';
  g.innerHTML = '<option value="">自動（' + esc(autoG) + '）</option><option value="__none__">不分組</option>' +
    live.map(function(c){ return '<option value="'+esc(c.name)+'">'+esc(c.name)+'</option>' }).join('');
  t.innerHTML = '<option value="">自動（' + esc(autoT) + '）</option>' +
    live.map(function(c){ return '<option value="'+esc(c.name)+'">'+esc(c.name)+'</option>' }).join('');
  $('ovShape').value = ''; g.value = ''; t.value = '';
}

function esc(s){ return String(s == null ? '' : s).replace(/[&<>"]/g, function(c){
  return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c] }) }

var TYPE_ZH = { date:'日期', time:'時間', money:'金額', number:'數字', phone:'電話',
  email:'信箱', url:'網址', person:'人員', status:'狀態', category:'分類',
  longtext:'長文字', text:'文字', empty:'空欄' };
var ROLE_ZH = { group:'分組', lead:'前導', title:'標題', meta:'標籤', body:'內文', rest:'欄位' };

function effective(){
  var shape = Object.assign({}, A.shape);
  var byName = function(n){ return A.cols.filter(function(c){ return c.name === n })[0] || null };
  var os = $('ovShape').value, og = $('ovGroup').value, ot = $('ovTitle').value;
  var live0 = A.cols.filter(function(c){ return c.type !== 'empty' });
  // 只換名字沒有用：渲染是看角色決定的，換版面必須連角色一起重算
  if(os) shape = SheetShape.shapeAs(live0, A.cols, os);
  if(og === '__none__') shape.group = null; else if(og) shape.group = byName(og);
  if(ot) shape.title = byName(ot);
  var live = A.cols.filter(function(c){ return c.type !== 'empty' });
  return { shape: shape, roles: SheetShape_assign(live, shape) };
}
// assignRoles 沒對外，用同樣規則重算一份
function SheetShape_assign(cols, shape){
  var used = {}, take = function(c, r){ if(!c || used[c.name]) return null; used[c.name] = r; return c };
  var roles = { group: take(shape.group,'group'), lead: take(shape.lead,'lead'),
                title: take(shape.title,'title'), meta:[], body:[], rest:[] };
  cols.forEach(function(c){ if(!used[c.name] && ['person','status','category','phone','email','url'].indexOf(c.type)>=0){ used[c.name]='meta'; roles.meta.push(c) } });
  cols.forEach(function(c){ if(!used[c.name] && c.type==='longtext'){ used[c.name]='body'; roles.body.push(c) } });
  roles.hidden = [];
  cols.forEach(function(c){
    if(used[c.name]) return;
    if(SheetShape.isNoise && SheetShape.isNoise(c)){ used[c.name]='hidden'; roles.hidden.push(c); return; }
    used[c.name]='rest'; roles.rest.push(c);
  });
  roles.assigned = used;
  return roles;
}

function paint(){
  var eff = effective();
  var shape = eff.shape, roles = eff.roles;

  $('shape').textContent = shape.shape === A.shape.shape ? A.shape.label : ($('ovShape').selectedOptions[0].textContent);
  $('dims').textContent = A.rows.length + ' 列 · ' + A.cols.filter(function(c){return c.type!=='empty'}).length + ' 欄';
  $('why').textContent = A.shape.reason;
  var st = [];
  if(A.title) st.push('<b>' + esc(A.title) + '</b>');
  st.push('標題列：第 ' + (A.headerRow + 1) + ' 列');
  if(A.headerRow > 0) st.push('略過 ' + A.headerRow + ' 列前言');
  if(A.totals && A.totals.length) st.push('合計列 ' + A.totals.length + ' 條');
  (A.notes || []).forEach(function(nt){ st.push('<span class="fix">' + esc(nt) + '</span>') });
  if(window.__skippedBlank) st.push('<span class="fix">略過 ' + window.__skippedBlank + ' 列沒有標題的空白列</span>');
  if(eff.roles.hidden && eff.roles.hidden.length)
    st.push('<span class="fix">收起流水號／代碼欄：' + esc(eff.roles.hidden.map(function(c){return c.name}).join('、')) + '</span>');
  $('struct').innerHTML = st.join('<span style="opacity:.4">·</span>');

  $('cols').innerHTML = A.cols.map(function(c){
    var role = roles.assigned[c.name];
    return '<tr>' +
      '<td><div class="cname">' + esc(c.name) + '</div>' +
        (c.samples.length ? '<div class="samp">' + esc(c.samples.join(' · ')) + '</div>' : '') + '</td>' +
      '<td><span class="ttag' + (c.type==='text'||c.type==='empty'?' dim':'') + '">' +
        (TYPE_ZH[c.type] || c.type) + '</span></td>' +
      '<td><span class="rtag' + (role?'':' none') + '">' + (ROLE_ZH[role] || '—') + '</span></td>' +
      '<td class="conf">' + Math.round(c.confidence * 100) + '%</td>' +
      '<td class="why-cell">' + esc(c.reason) + '</td></tr>';
  }).join('');

  window.__skippedBlank = 0;
  renderControls(roles.group ? roles.group.name : null);
  $('out').innerHTML = renderPage(shape, roles);
  renderRails();
  var h0 = $('hits'); if(h0) h0.textContent = window.__hits || '';
}

/* 搜尋與篩選是使用者頁面的一部分，所以放在預覽裡面而不是工具列。
   搜尋一律掃全表；篩選只放最值得放的一兩欄——
   「適合分組」和「適合篩選」門檻差很多：分組每一組都會變成段落標題，
   篩選只是下拉選單，普渡的人員有 49 個選項，當分組軸糟透了、當篩選軸完美。 */
function renderControls(groupName){
  var box = $('octl');
  // 已經拿來分組的欄位不必再當篩選——每一組本來就看得見了
  filterCols = SheetShape.filterOptions(A)
    .filter(function(f){ return f.name !== groupName })
    .slice(0, 2);
  var bigEnough = A.rows.length >= 20;      // 十幾列的表不需要搜尋框
  if(!bigEnough && !filterCols.length){ box.hidden = true; return; }

  var html = '';
  if(bigEnough) html += '<input id="oq" type="search" placeholder="搜尋…" autocomplete="off" value="' + esc(outQ) + '">';
  filterCols.forEach(function(f){
    var i = A.header.indexOf(f.name), tal = {}, lab = {};
    A.rows.forEach(function(r){
      var v = String(r[i] == null ? '' : r[i]).trim(); if(!v) return;
      (f.multi ? SheetShape.tokenizeCell(v) : [v]).forEach(function(t){
        var k = t.toLowerCase(); tal[k] = (tal[k]||0)+1; if(!lab[k]) lab[k] = t;
      });
    });
    var keys = Object.keys(tal).sort(function(a,b){
      return tal[b]-tal[a] || lab[a].localeCompare(lab[b],'zh-Hant');
    });
    html += '<select data-col="' + esc(f.name) + '"><option value="">所有' + esc(f.name) + '</option>' +
      keys.map(function(k){
        return '<option value="' + esc(k) + '"' + (outPicks[f.name] === k ? ' selected' : '') +
               '>' + esc(lab[k]) + '（' + tal[k] + '）</option>';
      }).join('') + '</select>';
  });
  html += '<div class="hits" id="hits"></div>';
  box.innerHTML = html;
  box.hidden = false;
}

/* 左右滑動的軌道。上下捲看內容、左右滑換段落——
   兩個軸一起才撐得住手機。23 個日期塞進下拉選單或一路往下捲都難用。 */
function renderRails(){
  var box = $('octl');
  [].forEach.call(box.querySelectorAll('.orail'), function(el){ el.remove() });

  // 多個表格（請假表的五個年度）要能在頁面裡切換，不能只靠工具列的分頁
  if(TABLES.length > 1){
    var t = document.createElement('div');
    t.className = 'orail tables';
    t.innerHTML = TABLES.map(function(a, i){
      var name = a.name || (a.title ? a.title.split('·')[0].trim() : '') || ('表 ' + (i+1));
      return '<button type="button" data-t="' + i + '" class="' + (i === cur ? 'on' : '') + '">' +
             esc(name) + '</button>';
    }).join('');
    box.appendChild(t);
  }

  var gs = window.__groups || [];
  if(gs.length >= 4){
    var g = document.createElement('div');
    g.className = 'orail groups';
    var today = new Date();
    var todayKey = today.getFullYear() + '-' + ('0'+(today.getMonth()+1)).slice(-2) +
                   '-' + ('0'+today.getDate()).slice(-2);
    g.innerHTML = '<button type="button" data-g="" class="' + (outGroup ? '' : 'on') + '">全部</button>' +
      gs.map(function(x){
        var cls = (x.key === todayKey ? 'now ' : '') + (x.key === outGroup ? 'on' : '');
        return '<button type="button" data-g="' + esc(x.key) + '" class="' + cls.trim() + '">' +
               (x.key === todayKey ? '今天 ' : '') + esc(x.label) +
               '<span style="opacity:.6"> ' + x.count + '</span></button>';
      }).join('');
    box.appendChild(g);
    // 沒特別選哪一段時，軌道要停在「今天」——那是 pudu 最有用的行為。
    // 「全部」永遠是選中狀態，不能拿它當捲動目標，否則永遠停在最左邊。
    var target = outGroup ? g.querySelector('button.on') : g.querySelector('button.now');
    if(target) g.scrollLeft = Math.max(0, target.offsetLeft - 14);
  }
  box.hidden = !box.children.length;
}

function matchFilters(r){
  for(var name in outPicks){
    var pick = outPicks[name]; if(!pick) continue;
    var f = filterCols.filter(function(x){ return x.name === name })[0];
    var i = A.header.indexOf(name);
    var v = String(r[i] == null ? '' : r[i]).trim();
    var vals = (f && f.multi) ? SheetShape.tokenizeCell(v) : [v];
    if(!vals.some(function(t){ return t.toLowerCase() === pick })) return false;
  }
  return true;
}
function matchQuery(r){
  return !outQ || r.join(' ').toLowerCase().indexOf(outQ) >= 0;
}
function hl(v){
  if(!outQ) return esc(v);
  return esc(v).replace(new RegExp('('+outQ.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+')','ig'), '<mark>$1</mark>');
}

/* ══ 渲染使用者實際看到的頁面 ══ */
function renderPage(shape, roles){
  var idx = {}; A.cols.forEach(function(c,i){ idx[c.name] = i });
  var cell = function(r, c){ return c ? String(r[idx[c.name]] == null ? '' : r[idx[c.name]]).trim() : '' };

  var recs = A.rows.map(function(r){ return { r:r } });

  // 沒有標題的列不是資料。帳表的模板預先編好 54 個項次，
  // 實際只填了 33 筆，其餘 21 列只有項次和單號——那會變成 21 張空白卡片。
  var skippedBlank = 0;
  if(roles.title){
    var before = recs.length;
    recs = recs.filter(function(rec){ return cell(rec.r, roles.title) !== '' });
    skippedBlank = before - recs.length;
  }
  var beforeFilter = recs.length;
  recs = recs.filter(function(rec){ return matchFilters(rec.r) && matchQuery(rec.r) });
  var filtering = outQ || Object.keys(outPicks).some(function(k){ return outPicks[k] });
  window.__hits = filtering ? recs.length + ' / ' + beforeFilter + ' 筆' : '';
  if(filtering && !recs.length)
    return head + '<div class="none">沒有符合的資料</div>';

  // 矩陣報表：整列數值都空白代表「這個月沒發生」，列出來只是雜訊
  var head = '';
  if(shape.matrix){
    var vals = roles.rest.concat(roles.meta);
    recs = recs.filter(function(rec){
      return vals.some(function(c){ return cell(rec.r, c) !== '' });
    });
    if(A.title){
      var segs = A.title.split('·').map(function(x){ return x.trim() }).filter(Boolean);
      head += '<p class="doc-title">' + esc(segs.slice(-2).join(' · ')) + '</p>';
    }
    if(A.totals && A.totals.length){
      var tr = A.totals[0], parts = [];
      A.cols.forEach(function(c, i){
        var v = String(tr[i] == null ? '' : tr[i]).trim();
        if(v && i > 0) parts.push('<span class="tk">' + esc(c.name) + '</span><span class="tv">' + esc(v) + '</span>');
      });
      if(parts.length) head += '<div class="totals">' + parts.join('') + '</div>';
    }
  }
  window.__skippedBlank = skippedBlank;
  if(!recs.length) return head + '<div class="none">這個表沒有任何有值的資料列</div>';

  var isDate = roles.group && roles.group.type === 'date';
  var isTime = roles.lead && roles.lead.type === 'time';
  var isMoney = roles.lead && roles.lead.type === 'money';
  var DOW = ['日','一','二','三','四','五','六'];

  // 分組（日期欄要沿用上一列的值，排程表常常只在變更時才填日期）
  var groups = [], byKey = {}, last = '';
  recs.forEach(function(rec){
    var key = '全部', sub = '';
    if(roles.group){
      var v = cell(rec.r, roles.group);
      if(isDate){
        var d = v ? SheetShape.parseDateish(v) : null;
        if(d){ last = d.getFullYear()+'-'+('0'+(d.getMonth()+1)).slice(-2)+'-'+('0'+d.getDate()).slice(-2);
               rec.label = (d.getMonth()+1)+'/'+d.getDate(); rec.dow = '週'+DOW[d.getDay()]; }
        key = last || '未排定';
        rec.label = rec.label || (last ? byKey[last] && byKey[last].label : '') || '未排定';
      } else { key = v || '未分類'; rec.label = key; }
    }
    if(!byKey[key]){ byKey[key] = { key:key, label:rec.label || key, sub:rec.dow || '', rows:[] }; groups.push(byKey[key]); }
    byKey[key].rows.push(rec);
  });
  if(isDate) groups.sort(function(a,b){ return a.key < b.key ? -1 : 1 });

  // 軌道要看得到全部段落，即使畫面只顯示其中一段
  window.__groups = roles.group
    ? groups.map(function(g){ return { key:g.key, label:g.label, sub:g.sub, count:g.rows.length } })
    : [];

  // 摘要：只引述表上原本就寫著的數字，不自己加總
  if(raw && SheetShape.quotedFacts && SheetShape.summarise){
    try{
      var qf = SheetShape.summarise(SheetShape.quotedFacts(raw, A), 6);
      if(qf.length){
        head += '<div class="quote"><h4>摘要 · 引述自表上</h4><dl>' + qf.map(function(f){
          return '<dt>' + esc(f.value) + '</dt><dd>' + esc(f.label) +
                 '<span class="src">' + esc(f.at) + '</span></dd>';
        }).join('') + '</dl></div>';
      }
    }catch(e){ /* 摘要失敗不該影響明細 */ }
  }

  // 「接下來三天」：比軌道更粗的一層導覽，不用滑就看到近期各有幾件事。
  // 只有日期軸有意義——帳表、請假表沒有「接下來」可言。
  if(isDate && groups.length >= 2){
    var t = new Date();
    var tk = t.getFullYear() + '-' + ('0'+(t.getMonth()+1)).slice(-2) + '-' + ('0'+t.getDate()).slice(-2);
    var up = groups.filter(function(g){ return g.key >= tk }).slice(0, 3);
    if(!up.length) up = groups.slice(-3);

    // 「重點日」不寫死門檻：某天的件數明顯高於中位數就標出來
    var counts = groups.map(function(g){ return g.rows.length }).sort(function(a,b){ return a-b });
    var mid = counts[Math.floor(counts.length/2)] || 1;
    var hotAt = Math.max(3, mid * 2.5);

    head += '<div class="upnext">' + up.map(function(g, i){
      var k = g.key === tk ? '今天' : (i === 0 ? '接下來' : (g.sub || '　'));
      var cls = (g.rows.length >= hotAt ? 'hot ' : '') + (g.key === outGroup ? 'on' : '');
      return '<button type="button" data-g="' + esc(g.key) + '" class="' + cls.trim() + '">' +
             '<span class="k">' + esc(k) + '</span>' +
             '<span class="d">' + esc(g.label) + '</span>' +
             '<span class="n">' + g.rows.length + ' 項</span></button>';
    }).join('') + '</div>';
  }
  if(outGroup) groups = groups.filter(function(g){ return g.key === outGroup });

  if(isTime) groups.forEach(function(g){
    g.rows.forEach(function(rec){
      var t = SheetShape.parseTimeish(cell(rec.r, roles.lead));
      rec.mins = t ? t.mins : 1e6; rec.lead = t ? t.text : '';
    });
    g.rows.sort(function(a,b){ return a.mins - b.mins });
  });

  return head + groups.map(function(g){
    var head = roles.group ? '<div class="g-head"><span class="g-name">' + esc(g.label) + '</span>' +
        (g.sub ? '<span class="g-sub">' + esc(g.sub) + '</span>' : '') +
        '<span class="g-cnt">' + g.rows.length + ' 筆</span></div>' : '';
    return head + '<ol>' + g.rows.map(function(rec){
      var r = rec.r;
      var lead = isTime ? (rec.lead || '') : (roles.lead && !isMoney ? cell(r, roles.lead) : '');
      var title = roles.title ? cell(r, roles.title) : '';
      var price = isMoney ? cell(r, roles.lead) : '';

      var metas = roles.meta.map(function(c){
        var v = cell(r, c); if(!v) return '';
        if(c.type === 'phone') return '<a class="m" href="tel:' + esc(v.replace(/[^\d+]/g,'')) + '">' + esc(v) + '</a>';
        if(c.type === 'email') return '<a class="m" href="mailto:' + esc(v) + '">' + esc(v) + '</a>';
        if(c.type === 'url')   return '<a class="m" href="' + esc(v) + '" target="_blank" rel="noopener">連結</a>';
        return '<span class="m">' + hl(v) + '</span>';
      }).filter(Boolean).join('');

      var body = roles.body.map(function(c){
        var v = cell(r, c); return v ? '<div class="body">' + hl(v) + '</div>' : '';
      }).join('');

      var kv = roles.rest.map(function(c){
        var v = cell(r, c); return v ? '<div class="k">' + esc(c.name) + '</div><div class="v">' + hl(v) + '</div>' : '';
      }).filter(Boolean).join('');

      return '<li class="rec' + (lead ? '' : ' nolead') + '">' +
        (lead ? '<div class="lead">' + esc(lead) + '</div>' : '') +
        '<div><div class="titleline"><p class="t">' + (hl(title) || '<span style="opacity:.4">（無標題）</span>') + '</p>' +
          (price ? '<span class="price">' + esc(price) + '</span>' : '') + '</div>' +
          (metas ? '<div class="metas">' + metas + '</div>' : '') + body +
          (kv ? '<div class="kv">' + kv + '</div>' : '') +
        '</div></li>';
    }).join('') + '</ol>';
  }).join('');
}

/* 診斷文字刻意不含任何儲存格內容——測試者會用公司的真實表格，
   回報問題不該連帶把資料一起送出去。 */
function diagnosticText(){
  if(!A) return '';
  var L = [];
  L.push('【CellFlow 診斷】');
  L.push('來源：' + (sheetKey || '未知'));
  L.push('表格數：' + TABLES.length + '（目前第 ' + (cur + 1) + ' 個）');
  if(A.name) L.push('表格名稱：' + A.name);
  L.push('判定形狀：' + A.shape.label);
  L.push('判定理由：' + A.shape.reason);
  L.push('標題列：第 ' + (A.headerRow + 1) + ' 列' + (A.headerRow ? '（略過 ' + A.headerRow + ' 列前言）' : ''));
  L.push('資料：' + A.rows.length + ' 列 × ' + A.cols.length + ' 欄' +
         (A.totals && A.totals.length ? '，合計列 ' + A.totals.length + ' 條' : ''));
  if(A.notes && A.notes.length) L.push('結構轉換：' + A.notes.join('；'));
  L.push('');
  L.push('欄位：');
  A.cols.forEach(function(c){
    L.push('  ' + c.name + ' → ' + (TYPE_ZH[c.type] || c.type) +
           '（角色 ' + (ROLE_ZH[(A.roles.assigned||{})[c.name]] || '無') +
           '、有值 ' + c.filled + '/' + c.total +
           '、相異 ' + c.distinct + '）');
  });
  var eff = effective();
  L.push('');
  L.push('目前呈現：分組=' + (eff.roles.group ? eff.roles.group.name : '無') +
         '、標題=' + (eff.roles.title ? eff.roles.title.name : '無') +
         '、前導=' + (eff.roles.lead ? eff.roles.lead.name : '無'));
  var q = (SheetShape.quotedFacts && raw) ? SheetShape.quotedFacts(raw, A).length : 0;
  L.push('摘要引述：' + q + ' 條');
  L.push('版本：CellFlow detect v25');
  return L.join('\n');
}

/* ══ 事件 ══ */
$('go').addEventListener('click', function(){ loadUrl($('url').value.trim()) });
$('url').addEventListener('keydown', function(e){ if(e.key === 'Enter') $('go').click() });
['ovShape','ovGroup','ovTitle'].forEach(function(id){ $(id).addEventListener('change', paint) });

// 只重畫輸出，不重建控制項，免得打字時焦點被搶走
function repaintOut(){
  var eff = effective();
  $('out').innerHTML = renderPage(eff.shape, eff.roles);
  renderRails();
  var h = $('hits'); if(h) h.textContent = window.__hits || '';
}
$('copyDiag').addEventListener('click', function(){
  var t = diagnosticText();
  if(!t) return;
  var done = function(){ var b = $('copyDiag'); var o = b.textContent;
    b.textContent = '已複製 ✓'; setTimeout(function(){ b.textContent = o }, 1600) };
  if(navigator.clipboard) navigator.clipboard.writeText(t).then(done, function(){ window.prompt('複製這段：', t) });
  else window.prompt('複製這段：', t);
});

$('octl').addEventListener('input', function(e){
  if(e.target.id === 'oq'){ outQ = e.target.value.trim().toLowerCase(); repaintOut() }
});
$('out').addEventListener('click', function(e){
  var b = e.target.closest('.upnext button'); if(!b) return;
  outGroup = (outGroup === b.dataset.g) ? '' : b.dataset.g;   // 再點一次回到全部
  repaintOut();
});

$('octl').addEventListener('click', function(e){
  var b = e.target.closest('button'); if(!b) return;
  if(b.dataset.t !== undefined){ showTable(+b.dataset.t); return; }
  if(b.dataset.g !== undefined){ outGroup = b.dataset.g; repaintOut() }
});
$('octl').addEventListener('change', function(e){
  var col = e.target.dataset && e.target.dataset.col;
  if(col){ outPicks[col] = e.target.value; repaintOut() }
});

$('ask').addEventListener('click', function(e){
  var b = e.target.closest('button'); if(!b) return;
  var k = b.dataset.k;
  saveChoice(k);
  $('ask').hidden = true;
  if(k !== '__dismissed__'){ $('ovGroup').value = k; paint(); }
});

$('tabs').addEventListener('click', function(e){
  var b = e.target.closest('button'); if(b) showTable(+b.dataset.i);
});

document.querySelectorAll('.samples button').forEach(function(b){
  b.addEventListener('click', function(){
    var v = SAMPLES[b.dataset.s];
    if(v.url){ $('url').value = v.url; loadUrl(v.url); }
    else { $('url').value = ''; loadXlsxUrl(v.xlsx, v.name); }
  });
});

var drop = $('drop');
['dragenter','dragover'].forEach(function(ev){
  drop.addEventListener(ev, function(e){ e.preventDefault(); drop.classList.add('over') });
});
['dragleave','drop'].forEach(function(ev){
  drop.addEventListener(ev, function(e){ e.preventDefault(); drop.classList.remove('over') });
});
drop.addEventListener('drop', function(e){
  var f = e.dataTransfer.files[0]; if(f) loadFile(f);
});
drop.addEventListener('click', function(){
  var i = document.createElement('input');
  i.type = 'file'; i.accept = '.csv,.tsv,.xlsx,.xls';
  i.onchange = function(){ if(i.files[0]) loadFile(i.files[0]) };
  i.click();
});
</script>
